name = "legal-api"
main = "src/index.js"
compatibility_date = "2026-09-01"

# Serve the site only from the custom domain (no duplicate *.workers.dev copy).
workers_dev = false

routes = [
  { pattern = "ahkam.app", custom_domain = true }
]

[[d1_databases]]
binding = "DB"
database_name = "egypt-judgments"
database_id = "22485ae3-e83c-47c5-8181-0b50f4129eb1"

# Optional per-IP rate limit for /api/*. Uncomment, pick a unique namespace_id,
# and redeploy. The code in src/routes/api.js is a no-op until this exists.
# [[ratelimits]]
# name = "SEARCH_LIMITER"
# namespace_id = "1001"
# simple = { limit = 60, period = 60 }
